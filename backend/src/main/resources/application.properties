# Mesma porta e mesmo prefixo do backend antigo: o frontend (Vite) redireciona
# tudo que começa com /api para http://localhost:3001.
quarkus.http.port=3001
quarkus.rest.path=/api

# Mostra no terminal cada chamada recebida (método, caminho, status).
quarkus.http.access-log.enabled=true
quarkus.http.access-log.pattern=%m %U %s

quarkus.banner.enabled=false

# Banco H2 em memória, em modo compatível com PostgreSQL (o banco do Supabase).
# Os dados vivem só enquanto o backend está ligado.
#
# Sem DB_CLOSE_DELAY: o banco some quando a última conexão fecha. Assim cada
# (re)início do backend começa com um banco novo em folha. (Antes era "apagar
# tudo e recriar" no mesmo banco, e depois de muitas recargas o H2 corrompia
# uma regra CHECK e se fechava.) min-size=1 mantém uma conexão sempre aberta,
# para o banco não sumir com o backend ligado.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:modulos;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.initial-size=1
quarkus.datasource.username=sa
quarkus.datasource.password=

# Ao ligar: roda os arquivos .sql, em ordem, no banco novo.
#   db/migration              -> tabelas dos módulos (é o que vai para o Supabase)
#   db/cliente-plus-simulado  -> imitação das tabelas que já existem no Cliente Plus
#   db/dados-demo             -> dados de exemplo (só deste laboratório)
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration,db/cliente-plus-simulado,db/dados-demo
# Aviso inofensivo: "H2 mais novo do que a versão testada pelo Flyway".
quarkus.log.category."org.flywaydb.core.internal.database.base.Database".level=ERROR

# Ver as tabelas e rodar SQL pelo navegador (só com npm run dev):
# http://localhost:3001/q/dev-ui -> Agroal -> Database view
%dev.quarkus.datasource.dev-ui.allow-sql=true

# Nomes das classes Java em camelCase viram snake_case no banco
# (ex.: nomeAcademia -> nome_academia).
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# Imagens e vídeos enviados (ex.: exercícios). Vídeos até 100 MB.
modulos.uploads-dir=data/uploads
quarkus.http.limits.max-body-size=110M

# Loja (lojista) de exemplo de cada módulo, até existir login.
academia.store-id=11111111-1111-4111-8111-111111111111
grupo-vip.store-id=22222222-2222-4222-8222-222222222222
